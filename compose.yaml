name: order-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-orders}
      POSTGRES_USER: ${DB_USER:-db_user_orders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db_password_orders}
    ports:
      - "${DB_EXPOSED_PORT:-2020}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - order-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq_user_orders}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_password_orders}
    ports:
      - "${RABBITMQ_EXPOSED_PORT:-3030}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-13030}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - order-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-orders}
      DB_USER: ${DB_USER:-db_user_orders}
      DB_PASSWORD: ${DB_PASSWORD:-db_password_orders}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbitmq_user_orders}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_password_orders}
      ORDER_PROCESSING_DELAY: ${ORDER_PROCESSING_DELAY:-3000ms}
      ORDER_PROCESSING_MAX_ATTEMPTS: ${ORDER_PROCESSING_MAX_ATTEMPTS:-3}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "${BACKEND_PORT:-4040}:4040"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - order-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4040
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - order-net

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  order-net:
    driver: bridge
