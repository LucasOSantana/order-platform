spring.application.name=order-platform
server.port=${SERVER_PORT:4040}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:2020}/${DB_NAME:orders}
spring.datasource.username=${DB_USER:db_user_orders}
spring.datasource.password=${DB_PASSWORD:db_password_orders}

# Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:3030}
spring.rabbitmq.username=${RABBITMQ_USER:rabbitmq_user_orders}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq_password_orders}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${ORDER_PROCESSING_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${ORDER_PROCESSING_RETRY_INITIAL_INTERVAL:1000ms}
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

app.orders.processing.delay=${ORDER_PROCESSING_DELAY:3000ms}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}

spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:always}
